# docker-compose.yml
# Usage: docker compose up -d  →  then  docker compose exec fuzzer bash

services:
  fuzzer:
    build: .
    image: fuzzing-lab:latest
    container_name: fuzzer

    # Mount your local project folder into the container.
    # Everything you save under /fuzzing/project inside the container
    # appears live in ./project on your host — and vice versa.
    volumes:
      - ./project:/fuzzing/project       # target source code & harness
      - ./findings:/fuzzing/findings     # AFL++ output (crashes, queue, etc.)

    # AFL++ needs elevated privileges for certain performance tweaks
    privileged: true

    # Keep the container alive so you can exec into it
    stdin_open: true
    tty: true
